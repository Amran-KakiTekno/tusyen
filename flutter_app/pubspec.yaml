name: eduapp
version: 1.0.0+1
publish_to: none
description: KSSR/KSSM Education App - Self-hosted learning platform

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Local Database (Offline-first)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.2
  path: ^1.8.3
  path_provider: ^2.1.1
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  
  # Networking
  dio: ^5.4.0
  http_parser: ^4.0.2
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^5.0.2
  
  # Auth
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  
  # Real-time
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.2
  
  # Media
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  video_player: ^2.8.1
  chewie: ^1.7.1
  file_picker: ^6.1.1
  open_filex: ^4.3.4
  
  # Gamification UI
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  
  # UI Components
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_slidable: ^3.0.1
  pull_to_refresh: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Notifications
  awesome_notifications: ^0.9.2
  
  # Utils
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  intl: ^0.19.0
  collection: ^1.18.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.4
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.0.6
  injectable_generator: ^2.4.1
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  drift_dev: ^2.14.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
